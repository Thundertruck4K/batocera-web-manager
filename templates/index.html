  <script>
  const HW_COLORS = {
    console:'#1f6feb',portable:'#2d5a27',computer:'#6b3fa0',
    arcade:'#8b2020',engine:'#6b5a00',fantasy:'#1a5a6b',other:'#444'
  };
  const CARD_PALETTE = ['#1f6feb','#2d5a27','#6b3fa0','#8b2020','#6b5a00','#1a5a6b','#3a3f46'];
  function cardColor(s){
    const name = (s && typeof s === 'object') ? (s.name || s.system || '') : (s || '');
    const nm = String(name || '');
    if (!nm) return CARD_PALETTE[0];
    let h = 0;
    for (let i = 0; i < nm.length; i++) {
      h = (h * 31 + nm.charCodeAt(i)) >>> 0;
    }
    return CARD_PALETTE[h % CARD_PALETTE.length];
  }
  function systemAccent(s){
    if (s && s.hardware && HW_COLORS[s.hardware]) return HW_COLORS[s.hardware];
    return cardColor(s);
  }
  function filterSystems(list, q){
    const qv = (q || '').trim().toLowerCase();
    if (!qv) return list.slice();
    return list.filter(x => {
      const name = String(x && x.name ? x.name : '');
      const fullname = String(x && x.fullname ? x.fullname : '');
      const blob = (name + ' ' + fullname).toLowerCase();
      return blob.includes(qv);
    });
  }
  function sortSystems(list, key){
    const k = key || 'name';
    // Optimización de re-render: decoramos (Schwartzian transform) una sola vez
    // por elemento en lugar de recalcular String()/toLowerCase()/Number() dentro
    // del comparador O(n log n) veces. El comparador solo lee claves ya normalizadas,
    // reduciendo el trabajo cuando búsqueda/orden re-pintan la lista repetidamente.
    const decorated = list.map(x => {
      const o = (x && typeof x === 'object') ? x : {};
      return {
        item: x,
        name: String(o.name ? o.name : '').toLowerCase(),
        fullname: String(o.fullname ? o.fullname : '').toLowerCase(),
        rom_count: Number(o.rom_count ? o.rom_count : 0)
      };
    });
    decorated.sort((a,b) => {
      if (k === 'roms' || k === 'rom_count') {
        if (b.rom_count !== a.rom_count) return b.rom_count - a.rom_count;
        if (a.name < b.name) return -1; if (a.name > b.name) return 1; return 0;
      }
      if (a.name < b.name) return -1; if (a.name > b.name) return 1;
      if (a.fullname < b.fullname) return -1; if (a.fullname > b.fullname) return 1;
      return 0;
    });
    return decorated.map(d => d.item);
  }
  </script>
